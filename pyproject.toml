[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "energy-project"
version = "0.1.0"
description = "Preparación reproducible del caso energético semisintético de Támesis"
requires-python = ">=3.12,<3.13"
dependencies = ["pandas>=2.2", "tzdata"]

[dependency-groups]
dev = ["pytest>=8"]

[project.scripts]
energy-project = "energy_project.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
