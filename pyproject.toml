[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "energy-project"
version = "0.1.0"
description = "Preparación reproducible del caso energético semisintético de Támesis"
requires-python = ">=3.12,<3.13"
dependencies = ["pandas>=2.2", "tzdata"]

[project.optional-dependencies]
pronosticos = [
    "chronos-forecasting==2.3.2",
    "timesfm[torch]==3.0.2",
    "tfc-t0[torch]==0.6.0",
    "torch>=2.2,<3",
    "numpy>=1.26",
    "scipy>=1.14,<2",
    "matplotlib>=3.9",
    "astral>=3.2,<4",
    "psutil>=5.9",
]

[dependency-groups]
dev = ["pytest>=8"]

[project.scripts]
energy-project = "src.cli:main"

[tool.setuptools]
packages = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
